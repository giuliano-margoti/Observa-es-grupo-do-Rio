<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário de Observações</title>
    <style>
        :root {
            --google-blue: #1a73e8;
            --gray-line: #dadce0;
            --text-main: #3c4043;
        }

        body { font-family: 'Roboto', Arial, sans-serif; color: var(--text-main); display: flex; flex-direction: column; align-items: center; background-color: #fff; margin: 0; padding: 20px; }

        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        .calendar-container { width: 100%; max-width: 800px; border: 1px solid var(--gray-line); border-radius: 8px; overflow: hidden; }

        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); background: #fff; border-bottom: 1px solid var(--gray-line); }

        .day-label { padding: 10px; text-align: center; font-size: 11px; font-weight: 500; color: #70757a; text-transform: uppercase; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }

        .calendar-day { min-height: 100px; padding: 8px; border-right: 1px solid var(--gray-line); border-bottom: 1px solid var(--gray-line); position: relative; cursor: pointer; transition: background 0.2s; }

        .calendar-day:nth-child(7n) { border-right: none; }

        .calendar-day:hover { background-color: #f8f9fa; }

        .day-number { font-size: 12px; font-weight: 500; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }

        .today .day-number { background-color: var(--google-blue); color: white; border-radius: 50%; }

        .event { background-color: var(--google-blue); color: white; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-top: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <header>
        <h2 id="monthDisplay">Março 2026</h2>
        <div style="color: #5f6368;">Observatório OPD / SOAR</div>
    </header>

    <div class="calendar-container">
        <div class="calendar-header">
            <div class="day-label">Dom</div><div class="day-label">Seg</div><div class="day-label">Ter</div>
            <div class="day-label">Qua</div><div class="day-label">Qui</div><div class="day-label">Sex</div><div class="day-label">Sáb</div>
        </div>
        <div class="calendar-grid" id="calendarGrid">
            </div>
    </div>

    <script>
        const grid = document.getElementById('calendarGrid');
        const monthDisplay = document.getElementById('monthDisplay');
        
        const now = new Date();
        const month = now.getMonth();
        const year = now.getFullYear();

        const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        monthDisplay.innerText = `${monthNames[month]} ${year}`;

        // Primeiro dia do mês e total de dias
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Espaços vazios antes do dia 1
        for (let i = 0; i < firstDay; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.classList.add('calendar-day');
            grid.appendChild(emptyDiv);
        }

        // Criar os dias
        for (let day = 1; day <= daysInMonth; day++) {
            const dayDiv = document.createElement('div');
            dayDiv.classList.add('calendar-day');
            if (day === now.getDate()) dayDiv.classList.add('today');

            dayDiv.innerHTML = `<div class="day-number">${day}</div>`;
            
            // Exemplo de como adicionar um evento via código:
            if (day === 15) {
                dayDiv.innerHTML += `<div class="event">Obs. SOAR</div>`;
            }

            grid.appendChild(dayDiv);
        }
    </script>
</body>
</html>
