<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><title>Escala 1.6m Perkin-Elmer</title>
    <style>
        body{font-family:sans-serif;padding:40px;background:#f7fbf9}
        .card{max-width:600px;margin:auto;background:white;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);border-top:8px solid #0d652d}
        .telescope-img { width: 100%; height: 100px; object-fit: cover; object-position: center; border-radius: 8px; margin: 10px 0; display: block; }
        .info{background:#e2f7ed;padding:15px;border-radius:8px;margin:20px 0}
        .btn-ocultacao { display: block; background: #0d652d; color: white; padding: 12px; margin-bottom: 8px; text-decoration: none; border-radius: 6px; font-weight: bold; text-align: center; }
        .lista-item { background: #effaf4; margin-bottom: 5px; padding: 10px; border-radius: 5px; border-left: 5px solid #0d652d; font-weight: bold; }
        .aux-box { background: #e8f5e9; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #c8e6c9; }
        .btn-download { display: inline-block; background: #2e7d32; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; margin-top: 5px; }
        .btn{display:inline-block;padding:10px 20px;background:#666;color:white;text-decoration:none;border-radius:5px}
    </style>
</head>
<body>
    <div class="card">
        <h1> Telescópio 1.6m Perkin-Elmer</h1>
        <img src="../imagens/1m60.png" alt="Telescópio 1.6m" class="telescope-img">
        <div class="info">
            <p><strong>Observadores:</strong> <span id="obs">---</span></p>
            <p><strong>Projeto:</strong> <span id="proj">---</span></p>
            <p><strong>Detector:</strong> <span id="det">---</span></p>
            <p><strong>PI:</strong> <span id="PI">---</span></p>
        </div>
        <div id="secaoOcultacao" style="display:none; margin: 20px 0;"><h3 style="color: #0d652d;"> Ocultações </h3><div id="listaLinks"></div></div>
        <div id="secaoRotação" style="display:none; margin: 20px 0;"><h3 style="color: #0d652d;"> Rotação </h3><div id="listaRotação"></div></div>
        <div id="secaoAstrometria" style="display:none; margin: 20px 0;"><h3 style="color: #0d652d;"> Astrometria </h3><div id="listaAstrometria"></div></div>
        <p><strong>Nota: </strong> <span id="Nota">---</span></p>
        <div id="secaoAux" style="display:none;" class="aux-box">
            <strong>Arquivos Auxiliares:</strong><br>
            <span id="nomeFov" style="font-size: 14px;"></span><br>
            <a id="linkDownload" href="#" class="btn-download" download>Baixar arquivo FOV SPARC4</a>
        </div>
        <div id="containerPlano" style="display:none; margin-top:15px; border-top: 1px solid #ccc; padding-top:10px;">
            <strong> Projeto Backup:</strong> <a id="linkPlano" href="#" target="_blank">Plano da noite</a>
        </div>
        <br><a href="../index.html" class="btn">← Voltar</a>
    </div>
    <script>
        const p = new URLSearchParams(window.location.search);
        const projeto = p.get('proj') || "";
        const detector = p.get('det') || "";
        document.getElementById('obs').innerText = p.get('obs') || "---";
        document.getElementById('proj').innerText = projeto;
        document.getElementById('det').innerText = detector || "Não especificado";
        document.getElementById('PI').innerText = p.get('PI') || "---";
        document.getElementById('Nota').innerText = p.get('Nota') || "Sem notas";

        if (detector.toLowerCase().includes("sparc4")) {
            document.getElementById('secaoAux').style.display = 'block';
            document.getElementById('nomeFov').innerText = "Configuração SPARC4";
            document.getElementById('linkDownload').href = "../fov/sparc4-1m60.fov";
        }

        const projNorm = projeto.toLowerCase();
        if (projNorm.includes("ocultação")) {
            document.getElementById('secaoOcultacao').style.display = 'block';
            p.get('links')?.split(',').forEach(par => {
                const idx = par.indexOf(':');
                if(idx !== -1) {
                    const a = document.createElement('a'); a.href = par.substring(idx+1).trim();
                    a.target = "_blank"; a.className = "btn-ocultacao";
                    a.innerText = par.substring(0, idx).trim();
                    document.getElementById('listaLinks').appendChild(a);
                }
            });
        }
        if (projNorm.includes("rotação")) {
            document.getElementById('secaoRotação').style.display = 'block';
            p.get('alvos')?.split(',').forEach((alvo, i) => {
                const div = document.createElement('div'); div.className = 'lista-item';
                div.innerText = `${i+1}: ${alvo.trim()}`;
                document.getElementById('listaRotação').appendChild(div);
            });
        }
        if (projNorm.includes("astrometria")) {
            document.getElementById('secaoAstrometria').style.display = 'block';
            p.get('campos')?.split(',').forEach((c, i) => {
                const div = document.createElement('div'); div.className = 'lista-item';
                div.innerText = `${i+1}: ${c.trim()}`;
                document.getElementById('listaAstrometria').appendChild(div);
            });
        }
        if (p.get('plano')) {
            document.getElementById('containerPlano').style.display = 'block';
            document.getElementById('linkPlano').href = "../" + p.get('plano');
        }
    </script>
</body>
</html>
