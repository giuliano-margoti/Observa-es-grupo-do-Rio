<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><title>Escala Zeiss 0.6m</title>
    <style>
        body{font-family:sans-serif;padding:40px;background:#fef9fb}
        .card{max-width:600px;margin:auto;background:white;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);border-top:8px solid #a91369}
        .telescope-img { width: 100%; height: 100px; object-fit: cover; object-position: center; border-radius: 8px; margin: 10px 0; display: block; }
        .info{background:#fce8f3;padding:15px;border-radius:8px;margin:20px 0}
        .btn-ocultacao { display: block; background: #a91369; color: white; padding: 12px; margin-bottom: 8px; text-decoration: none; border-radius: 6px; font-weight: bold; text-align: center; }
        .lista-item { background: #fdf2f8; margin-bottom: 5px; padding: 10px; border-radius: 5px; border-left: 5px solid #a91369; font-weight: bold; }
        .aux-box { background: #fce4ec; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #f8bbd0; }
        .btn-download { display: inline-block; background: #880e4f; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; margin-top: 5px; }
        .btn{display:inline-block;padding:10px 20px;background:#666;color:white;text-decoration:none;border-radius:5px}
    </style>
</head>
<body>
    <div class="card">
        <h1> Telescópio Zeiss 0.6m</h1>
        <img src="../imagens/zeiss.png" alt="Telescópio Zeiss" class="telescope-img">
        <div class="info">
            <p><strong>Observadores:</strong> <span id="obs">---</span></p>
            <p><strong>Projeto:</strong> <span id="proj">---</span></p>
            <p><strong>Detector:</strong> <span id="det">---</span></p>
            <p><strong>PI:</strong> <span id="PI">---</span></p>
        </div>
        <div id="secaoOcultacao" style="display:none; margin: 20px 0;"><h3 style="color: #a91369;"> Ocultações </h3><div id="listaLinks"></div></div>
        <div id="secaoRotação" style="display:none; margin: 20px 0;"><h3 style="color: #a91369;"> Rotação </h3><div id="listaRotação"></div></div>
        <div id="secaoAstrometria" style="display:none; margin: 20px 0;"><h3 style="color: #a91369;"> Astrometria </h3><div id="listaAstrometria"></div></div>
        <p><strong>Nota: </strong> <span id="Nota">---</span></p>
        <div id="secaoAux" style="display:none;" class="aux-box">
            <strong>Arquivos Auxiliares:</strong><br>
            <span id="nomeFov" style="font-size: 14px;"></span><br>
            <a id="linkDownload" href="#" class="btn-download" download>Baixar arquivo FOV</a>
        </div>
        <div id="containerPlano" style="display:none; margin-top:15px; border-top: 1px solid #ccc; padding-top:10px;">
            <strong> Projeto Backup:</strong> <a id="linkPlano" href="#" target="_blank">Plano da noite</a>
        </div>
        <br><a href="../index.html" class="btn">← Voltar</a>
    </div>
    <script>
        const p = new URLSearchParams(window.location.search);
        const projeto = p.get('proj') || "";
        const detector = p.get('det') || "";
        document.getElementById('obs').innerText = p.get('obs') || "---";
        document.getElementById('proj').innerText = projeto;
        document.getElementById('det').innerText = detector || "Não especificado";
        document.getElementById('PI').innerText = p.get('PI') || "---";
        document.getElementById('Nota').innerText = p.get('Nota') || "Sem notas";

        if (detector) {
            const d = detector.toLowerCase();
            let arq = "";
            if (d.includes("ikonl")) arq = "ikonl-zeiss.fov";
            if (d.includes("ixon")) arq = "ixon-zeiss.fov";
            if (arq) {
                document.getElementById('secaoAux').style.display = 'block';
                document.getElementById('nomeFov').innerText = "Configuração para " + detector;
                document.getElementById('linkDownload').href = "../fov/" + arq;
            }
        }

        // --- AS OUTRAS LÓGICAS (Ocultação, Rotação, Astrometria) ---
        const projetoNormalizado = projeto.toLowerCase();
        if (projetoNormalizado.includes("ocultação") || projetoNormalizado.includes("occultation")) {
            const linksString = p.get('links');
            if (linksString) {
                document.getElementById('secaoOcultacao').style.display = 'block';
                const container = document.getElementById('listaLinks');
                linksString.split(',').forEach(par => {
                    const firstColon = par.indexOf(':');
                    if(firstColon !== -1) {
                        const a = document.createElement('a');
                        a.href = par.substring(firstColon + 1).trim();
                        a.target = "_blank"; a.className = "btn-ocultacao";
                        a.innerText = par.substring(0, firstColon).trim();
                        container.appendChild(a);
                    }
                });
            }
        }
        // Rotação
        if (projetoNormalizado.includes("rotação") || projetoNormalizado.includes("rotation")) {
            const alvosString = p.get('alvos');
            if (alvosString) {
                document.getElementById('secaoRotação').style.display = 'block';
                const container = document.getElementById('listaRotação');
                alvosString.split(',').forEach((alvo, index) => {
                    const div = document.createElement('div');
                    div.className = 'lista-item';
                    div.innerText = `${index + 1}: ${alvo.trim()}`;
                    container.appendChild(div);
                });
            }
        }
        // Astrometria
        if (projetoNormalizado.includes("astrometria") || projetoNormalizado.includes("astrometry")) {
            const camposString = p.get('campos');
            if (camposString) {
                document.getElementById('secaoAstrometria').style.display = 'block';
                const container = document.getElementById('listaAstrometria');
                camposString.split(',').forEach((campo, index) => {
                    const div = document.createElement('div');
                    div.className = 'lista-item';
                    div.innerText = `${index + 1}: ${campo.trim()}`;
                    container.appendChild(div);
                });
            }
        }
        
        if (p.get('plano')) {
            document.getElementById('containerPlano').style.display = 'block';
            document.getElementById('linkPlano').href = "../" + p.get('plano');
        }
    </script>
</body>
</html>
